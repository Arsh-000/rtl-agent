[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-agent"
version = "0.1.0"
description = "LLM-driven RTL generation and optimization, judged by Yosys, OpenSTA and Icarus Verilog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pydantic>=2", "jinja2>=3", "requests>=2.28", "matplotlib>=3.6"]

[project.scripts]
rtl-agent = "rtl_agent.cli:main"

[tool.setuptools]
packages = ["rtl_agent", "rtl_agent.adapters", "rtl_agent.llm"]
