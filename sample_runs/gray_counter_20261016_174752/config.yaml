  defines: {}
spec:
  text: "An 8-bit up/down counter whose value is output in Gray code.\n- On every\
    \ rising clock edge where 'en' is 1, the internal binary count\n  goes up by 1\
    \ if 'up' is 1, or down by 1 if 'up' is 0. It wraps around\n  (255 + 1 = 0, 0\
    \ - 1 = 255).\n- 'rst' is an active-high synchronous reset that sets the count\
    \ to 0.\n- 'gray' is the current count converted to Gray code: gray = count ^\
    \ (count >> 1).\n  It must be a registered output (it changes only on clock edges),\
    \ and it changes on the\n  SAME clock edge as the count: after every edge, gray\
    \ already shows the Gray code of the new\n  count (no extra cycle of delay). After\
    \ reset, gray is 0.\n"
  interface: "module gray_counter (\n    input  wire       clk,\n    input  wire \
    \      rst,\n    input  wire       en,\n    input  wire       up,\n    output\
    \ reg  [7:0] gray\n);\n"
  clock_port: clk
  reset_port: rst
  rtl_attempts: 3
  testbench_attempts: 2
